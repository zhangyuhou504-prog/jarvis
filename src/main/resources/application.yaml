spring:
  application:
    name: jarvis
  ai:
    openai:
      # 公司 AI 网关（OpenAI 兼容接口），完整地址为 https://aigateway.mxbc.net/v1/chat/completions
      base-url: https://aigateway.mxbc.net/v1
      api-key: sk-aigw-IA7nb9o.ZnpewESUFAMxWNClaJoIqR8QZXnYGVuh
      chat:
        # Spring AI 底层 OpenAI SDK 的 HTTP 超时（默认 60s），网关长回答常超 60s
        timeout: 120s
        options:
          model: qwen3.8-27b
          temperature: 0.7

server:
  port: 8081

jarvis:
  llm:
    # 默认模型（WebClient 模型调用层使用）
    default-model: mxbc-qwen

    # 模板 → 模型的路由映射（ModelRouter 第一版确定性规则）：
    # 不指定 modelId 时使用某模板，则路由到映射的模型；模板未配置映射时回落默认模型。
    template-models:
      sql-analysis: gjld-qwen

    # 意图 → 模型的路由映射（第五阶段：意图识别参与路由）：
    # 用户未指定 modelId、模板也未映射时，按 IntentService 识别出的意图选模型。
    # 意图标识为 IntentType 枚举名；UNKNOWN 不参与路由（识别失败回落默认模型）。
    # 未配置某意图时同样回落默认模型。后续接入更多模型后可按意图细分。
    intent-models:
      SQL_ANALYSIS: mxbc-qwen
      TROUBLESHOOTING: mxbc-qwen
      DATA_QUERY: mxbc-qwen
      # GENERAL_QA 不配置 → 走默认模型 mxbc-qwen

    connections:
      # 硅基流动
      gjld:
        base-url: https://api.siliconflow.cn/v1
        api-key: sk-kcvodeppmiwvapgpgcflkjsjrmoocsfjcbgqgutmoyxvzttu
      mxbc:
        base-url: https://aigateway.mxbc.net/v1
        api-key: sk-aigw-IA7nb9o.ZnpewESUFAMxWNClaJoIqR8QZXnYGVuh

    models:
      gjld-qwen:
        connection: gjld
        model-name: Qwen/Qwen3.8-27B
        temperature: 0.7
        max-tokens: 4096
      mxbc-qwen:
        connection: mxbc
        model-name: qwen3.8-27b
        temperature: 0.7
        max-tokens: 4096
        # 公司网关特定扩展参数：关闭思考阶段，规避其推理模型思考期整段缓冲导致的流式超时。
        # 平台扩展参数按模型配置，其他平台（如 gjld）不配即不下发。
        enable-thinking: false

  chat:
    # 流式：相邻两个原始 SSE 事件之间的最大等待秒数，超时则中断并优雅收尾
    stream-element-timeout-seconds: 120
    # 多轮对话：每次请求携带的历史消息条数上限（user/assistant 各算一条），超出取最近 N 条
    max-history-messages: 20

  # 意图识别专用配置：分类输出很短，应指向更快/更稳定的模型，与主对话模型解耦。
  intent:
    # 是否启用意图识别参与模型路由（ChatService 流式链路）。
    # 关闭后跳过分类调用（不增加首 token 延迟），路由退化为"指定 modelId → 模板映射 → 默认模型"。
    enabled: true
    # 意图识别使用的模型 ID（对应 jarvis.llm.models 的 key）；空则用 default-model。
    # 用 gjld-qwen（硅基流动，实测响应快且实时），避免默认 mxbc-qwen 非流式超时。
    model-id: mxbc-qwen
    # 意图识别的模型调用超时（秒）。分类输出短，正常几秒内完成。
    timeout-seconds: 60

  # 工具调用（Tool Calling）配置
  tool:
    # 单次对话最多执行的工具调用轮数，防止模型陷入无限调用
    max-rounds: 5
    # 工具循环内单次非流式模型调用超时（秒）
    call-timeout-seconds: 120
    # getCurrentTime 工具：用户未指定时区时使用的默认时区（IANA 格式）
    default-timezone: Asia/Shanghai
