spring:
  application:
    name: jarvis
  ai:
    openai:
      # 公司 AI 网关（OpenAI 兼容接口），完整地址为 https://aigateway.mxbc.net/v1/chat/completions
      base-url: https://aigateway.mxbc.net/v1
      api-key: sk-aigw-IA7nb9o.ZnpewESUFAMxWNClaJoIqR8QZXnYGVuh
      chat:
        # Spring AI 底层 OpenAI SDK 的 HTTP 超时（默认 60s），网关长回答常超 60s
        timeout: 120s
        options:
          model: qwen3.8-27b
          temperature: 0.7

server:
  port: 8081

jarvis:
  llm:
    # 默认模型（WebClient 模型调用层使用）
    default-model: mxbc-qwen

    connections:
      # 硅基流动
      gjld:
        base-url: https://api.siliconflow.cn/v1
        api-key: sk-kcvodeppmiwvapgpgcflkjsjrmoocsfjcbgqgutmoyxvzttu
      mxbc:
        base-url: https://aigateway.mxbc.net/v1
        api-key: sk-aigw-IA7nb9o.ZnpewESUFAMxWNClaJoIqR8QZXnYGVuh

    models:
      gjld-qwen:
        connection: gjld
        model-name: Qwen/Qwen3.8-27B
        temperature: 0.7
        max-tokens: 4096
      mxbc-qwen:
        connection: mxbc
        model-name: qwen3.8-27b
        temperature: 0.7
        max-tokens: 4096

  chat:
    # 是否启用模型思考（reasoning）阶段。
    # 默认 false：qwen3.8-27b 思考阶段网关有时整段缓冲、长时间不推 chunk，会导致流式超时；
    # 关闭后 2 秒内即开始推流，响应稳定。需要更强推理质量时改为 true。
    enable-thinking: false
    # 流式：相邻两个原始 SSE 事件之间的最大等待秒数，超时则中断并优雅收尾。
    # 关闭思考后首 chunk 约 2s，120s 仅作真正挂起的兜底。
    stream-element-timeout-seconds: 120
    # 多轮对话：每次请求携带的历史消息条数上限（user/assistant 各算一条），超出取最近 N 条
    max-history-messages: 20
